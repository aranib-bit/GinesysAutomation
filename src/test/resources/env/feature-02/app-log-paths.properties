# App server log paths — one path per value, wildcards supported.
# Backslashes do not need escaping here (file is read by RawPropertyReader, not Properties.load).
# Add or remove entries freely; changes take effect on the next test run without recompiling.
#
# Key names are for readability only — only the values (right of =) are used as log paths.

# ── Finance API (C#/.NET, custom Serilog, date-rotated: one file per day) ──────────────────
finance.api.error=C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_*_ERROR.log
finance.api.info=C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_*_INFO.log
finance.api.eflogger=C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_EFLogger_*

# ── WebAPI — Log4Net level-first format, size-rotated (ErrorApp.log, ErrorApp.1, ...) ──────
webapi.error=C:\GSL\GINESYS12\WebAPI\Logs\ErrorApp*
webapi.info=C:\GSL\GINESYS12\WebAPI\Logs\InfoApp*
webapi.debug=C:\GSL\GINESYS12\WebAPI\Logs\DebugApp*
webapi.nhibernate=C:\GSL\GINESYS12\WebAPI\Logs\others\nhibernatesql.log*

# ── WebUI — Log4Net, single file, not rotated ───────────────────────────────────────────────
webui.trace=C:\GSL\GINESYS12\WebUI\trace.log
