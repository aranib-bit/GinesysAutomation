# qaprod — no database access in this environment.
# url exactly as provided; verify live whether the app also needs /UI/index.html appended
# (other envs use https://<host>/GINESYSWeb/UI/index.html).
url=https://qaprod.ginesys.cloud/ginesysweb/#erplogin
# Scenario data comes from the Excel workbooks in env/qaprod/data; the API serves everything that used to need the DB.
testdata.source=API
# No DB here: no DB connection is ever attempted (DatabaseManager refuses), DB-derived validation is replaced by
# API/audit validation (validation.nodb.mode=API) — set SKIP to skip those checks instead.
db.available=no
validation.nodb.mode=API

# Validation switches: does the validation run at all (no = skipped, saves time).
# What the report shows is controlled separately by report.validation.*.enabled in report.properties.
# validation.db.enabled is also forced off when db.available=no.
validation.ui.enabled=yes
validation.api.enabled=yes
validation.db.enabled=yes
