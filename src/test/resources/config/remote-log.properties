# ─── Remote Log Collection Behaviour ─────────────────────────────────────────
# ON_FAILURE = collect on test failure only | ALWAYS = collect always | NEVER = disabled
remote.logs.capture.mode=NEVER
remote.logs.keywords=
remote.logs.max.lines=500
remote.logs.debug.enabled=false

# ─── SSH Settings ─────────────────────────────────────────────────────────────
remote.logs.ssh.connect.timeout.seconds=10
remote.logs.ssh.read.timeout.seconds=30
remote.logs.ssh.command.timeout.seconds=60
remote.logs.ssh.retry.count=3
# ACCEPT_NEW (default) | STRICT (requires ~/.ssh/known_hosts) | DISABLED (insecure)
remote.logs.ssh.host.key.verify=ACCEPT_NEW

# ─── SSH Connection Pool ──────────────────────────────────────────────────────
remote.logs.ssh.pool.size=5
remote.logs.ssh.pool.max.wait.seconds=10

# ─── WinRM Settings ───────────────────────────────────────────────────────────
remote.logs.winrm.connect.timeout.seconds=10
remote.logs.winrm.operation.timeout.seconds=60
# Max rotated files to read per size-rotated log path pattern (most recent first)
remote.logs.winrm.rotated.max.files=3

# ─── Log Timestamp Parsing ────────────────────────────────────────────────────
# Timezone offset appended when parsing log lines that use "yyyy-MM-dd HH:mm:ss"
# format (no embedded offset). Use +05:30 for IST, Z for UTC.

# ─── Remote Machine Setup ─────────────────────────────────────────────────────
# OS is AUTO-DETECTED at runtime via SSH probe.
# Credentials — prefer environment variables (CI/CD); config keys are a plaintext
# fallback for local/dev runs only. Env vars always take priority when both are set.
#   SSH   → env: REMOTE_LOG_SSH_USER  / REMOTE_LOG_SSH_PASS
#   WinRM → env: REMOTE_LOG_WINRM_USER / REMOTE_LOG_WINRM_PASS

# Application Server — fill host to enable, leave blank to disable
# Log path patterns — managed in app-log-paths.properties (one path per line)
# Fallback if the file above is missing:
#remote.app.server.log.paths=C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_*_ERROR.log,...
# WinRM credentials (Windows app server) — leave blank to use env vars only
# SSH credentials (Linux app server) — leave blank to use env vars only

# Database Server — fill host to enable, leave blank to disable
# WinRM credentials (Windows DB server) — leave blank to use env vars only
# SSH credentials (Linux DB server) — leave blank to use env vars only
