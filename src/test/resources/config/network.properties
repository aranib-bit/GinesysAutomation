# ─── Network capture ─────────────────────────────────────────────────────────
enable.network.logs=true
# true = attach network logs only on test failure (reduces report size significantly)
network.capture.failed.only=true
# always | failure  — controls when network timing table is logged to the report
network.timing.log.on=failure
# always | failure  — controls when request cookies table is logged to the report
network.cookies.log.on=failure
# always | failure  — controls when initiator call stack table is logged to the report
network.callstack.log.on=failure
network.capture.headers=true
network.capture.body=true
# Max network request snapshots retained per test (ring-buffer — oldest evicted when cap reached)
network.capture.max.snapshots=150
# Comma-separated URL substrings to capture. Empty = capture all traffic.
network.capture.url.filter=
# true = show all requests on passing tests (overrides @ApiFlow filter)
network.capture.pass.show.all=false

# ─── Browser log capture ──────────────────────────────────────────────────────
browser.logs.enabled=true
browser.logs.capture.on.failure=true
browser.logs.fail.on.js.error=true
browser.logs.fail.on.critical.js.error=true
browser.logs.capture.only=false
browser.logs.level=INFO
browser.logs.warning.patterns=
browser.logs.ignore.patterns=
