# ─── Browser settings ─────────────────────────────────────────────────────────
# chrome | firefox | edge
browser=chrome
# local | remote
runmode=remote
remoteurl=http://localhost:4444/wd/hub
headless=false
incognito=false
acceptInsecureCerts=false
# Standardized across local/Docker/grid so popups render at identical, non-clipped
# positions regardless of environment — see browser.window.width/height below.
browser.window.width=1366
browser.window.height=768

# (network.mode was removed: the capture protocol is chosen automatically from the driver —
#  Chrome/Edge → CDP, Firefox → BiDi — and is reported from the actual browser, never configured.)

# ─── Remote execution providers ───────────────────────────────────────────────
grid.url=http://localhost:4444/wd/hub
docker.grid.url=http://localhost:4444/wd/hub
browserstack.username=
browserstack.accesskey=
browserstack.build.name=CI Build
lambdatest.username=
lambdatest.accesskey=

# ─── UI Framework Adapter ──────────────────────────────────────────────────────
# Target UI framework: extjs | react | angular
application.type=extjs
