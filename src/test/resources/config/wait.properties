# ─── Core wait timings ────────────────────────────────────────────────────────
polling.millis=200
pageload.timeout.seconds=30
componentready.timeout.seconds=20
interaction.wait.seconds=10
short.wait.seconds=3
popup.wait.seconds=30

# Max retries (3 s each) for the non-critical warning-message text read
warning.msg.max.retries=2

# ─── Select-Document popup timing / scroll tuning ────────────────────────────
selectdoc.grid.load.buffer.ms=200
selectdoc.jump.render.ms=500
# Runaway-loop guard for the mouse-wheel scroll fallback. NOT a tuning knob —
# the loop terminates on content-based end-of-list (atBottom + no progress
# for 2 consecutive iterations); this cap only stops it from spinning forever
# if the end-of-list signal somehow never fires.
selectdoc.scroll.safety.cap=1000
selectdoc.scroll.step.wait.ms=400
selectdoc.focusrow.render.ms=1500
selectdoc.click.buffer.ms=300
selectdoc.loader.max.retries=3

# Max retries when a click is intercepted by the transient ext-element overlay
click.overlay.retry.max=3

# ─── Unexpected popup detection ───────────────────────────────────────────────
popup.detection.enabled=true
popup.detection.timeout.ms=1500
popup.detection.polling.ms=100

# ─── Document selector (atomic SL + doc selection) ────────────────────────────
# POSITIVE = strict positive (default). MIXED = any non-zero. HYBRID = positive, fall back to mixed per SL.
doc.selector.mode=POSITIVE
# Over-fetch SLs from DB to absorb parallel contention
doc.selector.overfetch.multiplier=3
# Backoff (ms) between retry attempts
doc.selector.retry.backoff.ms=1500
# Floor for documentCount when ArVoucherFixtureOptions.defaults() is used
doc.selector.documentcount.default=3
