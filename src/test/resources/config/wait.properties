# ─── Core wait timings ────────────────────────────────────────────────────────
polling.millis=200
pageload.timeout.seconds=30
componentready.timeout.seconds=20
interaction.wait.seconds=10
short.wait.seconds=3
popup.wait.seconds=30

# Max retries (3 s each) for the non-critical warning-message text read
warning.msg.max.retries=2

# ─── Select-Document popup timing / scroll tuning ────────────────────────────
selectdoc.grid.load.buffer.ms=200
selectdoc.jump.render.ms=500
# Runaway-loop guard for the mouse-wheel scroll fallback. NOT a tuning knob —
# the loop terminates on content-based end-of-list (atBottom + no progress,
# confirmed across selectdoc.scroll.noprogress.streak.required independently
# re-checked iterations below); this cap only stops it from spinning forever
# if the end-of-list signal somehow never fires.
selectdoc.scroll.safety.cap=1000
selectdoc.scroll.step.wait.ms=400
# Extra confirmation wait paid ONLY on a candidate end-of-list tick (atBottom +
# !storeLoading + no progress) — gives a slow BufferedStore async page-fetch on a
# live/staging server real time to land before a "no progress" reading is trusted.
# Fixes a confirmed false-positive: the old fixed "2 quick reads 400ms apart" check
# was declaring end-of-list mid-page while more rows were still loading, causing
# EditGeneralVoucher's paginated search to scan every page of a 35-page result set
# and still fail to find a document that was genuinely further down an abandoned page.
selectdoc.scroll.noprogress.confirm.wait.ms=1200
# Independently re-confirmed no-progress ticks required before declaring genuine
# end-of-list (each tick already carries its own confirm wait above).
selectdoc.scroll.noprogress.streak.required=3
selectdoc.focusrow.render.ms=1500
selectdoc.click.buffer.ms=300
selectdoc.loader.max.retries=3
# Round 10 (RC-11): gap before re-confirming a checkbox is STILL checked after it was already
# read as checked once, and max select+stability-recheck attempts before giving up — closes a
# confirmed async-grid-reload race that can silently clear selection moments after it was
# genuinely registered. See WaitConfig's Javadoc on these two keys for the full rationale.
selectdoc.stability.recheck.delay.ms=400
selectdoc.max.select.attempts=3

# Max retries when a click is intercepted by the transient ext-element overlay
click.overlay.retry.max=3

# Staged wait for #splashScreen to genuinely disappear (opacity fade-out) inside
# WaitUtils.waitForClickOverlay()'s splash-screen phase: an initial wait, then up to
# poll.max.retries further polls of poll.seconds each, logged individually so a genuinely-stuck
# splash screen leaves a full timeline in the report instead of one opaque timeout. Note this
# phase runs inside click.overlay.retry.max's own outer retry loop above, so the worst-case total
# is click.overlay.retry.max x (initial.wait + poll.max.retries x poll.seconds).
splashscreen.initial.wait.seconds=30
splashscreen.poll.seconds=15
splashscreen.poll.max.retries=4

# Round 8: same staged-poll shape as the splash-screen wait above, applied to the ExtJS
# .x-mask/.x-mask-msg wait (WaitUtils.waitForExtMaskInternal) — an initial extjs.timeout (40s,
# finance.properties) wait, then up to poll.max.retries further polls of poll.seconds each,
# logged individually. Worst case for a THROWING mask wait: 40 + 4x15 = 100s (was a single 40s
# attempt with no retry at all). waitForPostSaveMask/waitForExtMaskBestEffort deliberately stay
# single-attempt — see their own Javadoc for why.
mask.poll.seconds=15
mask.poll.max.retries=4

# Post-module-click "Loading Package" bootstrap wait (menu/permissions/site package fetch) —
# deliberately separate from the generic timeout=30 (config.properties) and extjs.timeout=40
# (finance.properties) tiers: this is a heavier, one-off step per module entry, not a routine
# mask clear. Independently tunable — lower back toward 30 if staging load turns out to be
# transient rather than a lasting characteristic of this environment.
module.packageload.timeout.seconds=60

# Post-mask dashboard-header render check (TopModuleMenuComponent.navigateToModule) — confirms
# the module's dashboard panel actually rendered, not just that the loading mask cleared. Short
# on purpose: only covers the ExtJS panel-render race, which resolves in seconds when healthy.
dashboard.header.timeout.seconds=15
# Global on/off switch for the dashboard-loaded verification above. Set to false to skip the
# check for every module without touching code.
dashboard.verification.enabled=true
# Comma-separated module display names (e.g. Finance,Inventory) excluded from dashboard-loaded
# verification even when the switch above is enabled. Empty = no module excluded.
dashboard.verification.disabled.modules=

# ─── Unexpected popup detection ───────────────────────────────────────────────
popup.detection.enabled=true
popup.detection.timeout.ms=1500
popup.detection.polling.ms=100

# ─── Document selector (atomic SL + doc selection) ────────────────────────────
# POSITIVE = strict positive (default). MIXED = any non-zero. HYBRID = positive, fall back to mixed per SL.
doc.selector.mode=POSITIVE
# Over-fetch SLs from DB to absorb parallel contention
doc.selector.overfetch.multiplier=3
# Backoff (ms) between retry attempts
doc.selector.retry.backoff.ms=1500
# Floor for documentCount when ArVoucherFixtureOptions.defaults() is used
doc.selector.documentcount.default=1
