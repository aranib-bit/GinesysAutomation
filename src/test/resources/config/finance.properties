# ─── Finance module settings ──────────────────────────────────────────────────
# AP Voucher sub-ledger selection strategy (AR Voucher is always NATIVE).
#   JAVASCRIPT = inject values via Ext store rec.set (fast; does NOT trigger TDS evaluation)
#   NATIVE     = drive the real grid combo so the app evaluates TDS itself
# Use NATIVE for TDS-deduction scenarios in AP Voucher.
subledger.selection.mode=NATIVE

# ExtJS synchronization timeouts (seconds)
extjs.timeout=40
extjs.min.timeout=10

# Maximum calendar days a back-dated document date may go into the past
finance.backdate.max.days=58

# Tolerance in seconds for finvchmain.creation_dt vs UI save time
db.creation.tolerance=30

# INDIA | USA_3 | USA_4 | USA_5 | USA_6 | ALPHANUMERIC | ROTATE
cheque.country=ROTATE

# Temporary workaround for a known, already-logged UI defect: General Voucher's Numeric UDF
# (finvchmain.udfnum01) displays/saves 0 instead of blank when empty. Keep this false here —
# flip to true only in your own local override when running against an environment where the
# bug is present. Remove this flag entirely once the UI defect is fixed.
finance.gv.suppress.udfnum01.zero.bug=true

# Document-scheme availability (DocSchemeResolver). A scheme needs at least this many numbers left
# (10^width - 1 - lastno) to be picked by default.
docscheme.min.headroom=1

# Dedicated small-width test schemes (comma-separated docnames). Never picked in AUTO mode; used by
# the exhausted-scheme regression and the only schemes the provisioner/k6 filler may create or fill.
docscheme.test.names=AR AP Test,GV Test

# Environments where the doc-scheme provisioner / k6 filler may create or bulk-fill data (comma-separated env folders).
docscheme.provision.allowed.envs=clone-staging

# Expected UI error text when Save is clicked on a doc scheme with no numbers left (NegativeValidation.DOC_SCHEME_EXHAUSTED).
# Left blank on purpose: the app currently shows no proper message (known defect). Set it to the agreed wording;
# while blank the exhausted-scheme scenario fails fast with a clear message instead of asserting invented text.
docscheme.exhausted.expected.message=

# Dedicated test schemes the provisioner creates and the k6 filler fills (names must also be in docscheme.test.names).
docscheme.test.gv.name=GV Test
docscheme.test.gv.prefix=TGV/
docscheme.test.arap.name=AR AP Test
docscheme.test.arap.prefix=TAR/
docscheme.test.width=3
