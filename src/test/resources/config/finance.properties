# ─── Finance module settings ──────────────────────────────────────────────────
# AP Voucher sub-ledger selection strategy (AR Voucher is always NATIVE).
#   JAVASCRIPT = inject values via Ext store rec.set (fast; does NOT trigger TDS evaluation)
#   NATIVE     = drive the real grid combo so the app evaluates TDS itself
# Use NATIVE for TDS-deduction scenarios in AP Voucher.
subledger.selection.mode=NATIVE

# ExtJS synchronization timeouts (seconds)
extjs.timeout=40
extjs.min.timeout=10

# Maximum calendar days a back-dated document date may go into the past
finance.backdate.max.days=58

# Tolerance in seconds for finvchmain.creation_dt vs UI save time
db.creation.tolerance=30

# INDIA | USA_3 | USA_4 | USA_5 | USA_6 | ALPHANUMERIC | ROTATE
cheque.country=ROTATE

# Temporary workaround for a known, already-logged UI defect: General Voucher's Numeric UDF
# (finvchmain.udfnum01) displays/saves 0 instead of blank when empty. Keep this false here —
# flip to true only in your own local override when running against an environment where the
# bug is present. Remove this flag entirely once the UI defect is fixed.
finance.gv.suppress.udfnum01.zero.bug=true
