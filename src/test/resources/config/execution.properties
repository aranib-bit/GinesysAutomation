# ─── Execution control ────────────────────────────────────────────────────────
execution.type=SET1
thread.count=5
concurrent.user.count=2
sync.timeout.seconds=30

# ─── UserPool starvation thresholds (STALL-BASED) ────────────────────────────
# Both values measure how long the pool has gone WITHOUT turning over.
# pool.warn.at.seconds          — WARN log + ExtentReport infra-node entry
# pool.acquire.timeout.seconds  — hard fail (UserPoolAcquisitionTimeoutException)
pool.warn.at.seconds=300
pool.acquire.timeout.seconds=600

# ─── Suite circuit breaker ────────────────────────────────────────────────────
# OFF by default — flip to true only for scheduled production regression runs.
suite.abort.enabled=false
suite.abort.on.failure.percent=30
suite.abort.min.tests.before.check=100
suite.abort.check.interval=50

# ─── Retry / Flaky Analytics ──────────────────────────────────────────────────
# 0 = retry disabled (default). Set to 2 or 3 to enable retry for flaky tests.
retry.max.count=0
