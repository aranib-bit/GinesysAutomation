# ─── Execution control ────────────────────────────────────────────────────────
execution.type=SET1
thread.count=5
concurrent.user.count=2
sync.timeout.seconds=30

# ─── UserPool starvation thresholds (STALL-BASED) ────────────────────────────
# Both values measure how long the pool has gone WITHOUT turning over.
# pool.warn.at.seconds          — WARN log + ExtentReport infra-node entry
# pool.acquire.timeout.seconds  — hard fail (UserPoolAcquisitionTimeoutException)
pool.warn.at.seconds=300
pool.acquire.timeout.seconds=600

# ─── Session lease (SessionPool hygiene) ─────────────────────────────────────
# Under the SessionPool model these bound how much total reuse one logged-in browser session
# accumulates before borrow() destroys and recreates it — hygiene against browser memory bloat
# and server-side session TTL, NOT anti-hoarding (sessions return to the pool after every row,
# so a thread can never hoard a permit between rows). Safe to raise.
session.max.lease.rows=10
session.max.lease.seconds=600

# ─── SessionPool borrow timeout ───────────────────────────────────────────────
# Max time one data-provider thread may wait to borrow a logged-in session. Much larger than
# pool.acquire.timeout.seconds by design: with runInParallel=true there can be
# (methods x data-provider-thread-count) waiters sharing capacity(=UI user count) sessions,
# and a waiter may legitimately queue behind several multi-minute rows.
session.borrow.timeout.seconds=1800

# ─── Suite circuit breaker ────────────────────────────────────────────────────
# OFF by default — flip to true only for scheduled production regression runs.
suite.abort.enabled=false
suite.abort.on.failure.percent=30
suite.abort.min.tests.before.check=100
suite.abort.check.interval=50

# ─── Retry / Flaky Analytics ──────────────────────────────────────────────────
# 0 = retry disabled (default). Set to 2 or 3 to enable retry for flaky tests.
retry.max.count=0
