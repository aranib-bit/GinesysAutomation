# ─── Execution control ────────────────────────────────────────────────────────
execution.type=SET1
thread.count=5
concurrent.user.count=2
sync.timeout.seconds=30

# ─── Concurrent browser-session cap, per target OS (see ConcurrencyCap / SessionPool.capacity) ───
# SessionPool normally sizes itself from the UI-user count. A cap lowers that for the OS in
# -Dtarget.os; blank = no cap. One Windows 11 VM (4 cores / 8 GB) handles only ~2-3 parallel
# sessions, so Windows starts at 2 — raise it here (or with -D / the Jenkins MAX_SESSIONS
# parameter) when the VM gets more resources. Keep the Windows Grid node's --max-sessions >= this.
# max.concurrent.sessions overrides both for a one-off run.
max.concurrent.sessions.linux=
max.concurrent.sessions.windows=2

# ─── UserPool starvation thresholds (STALL-BASED) ────────────────────────────
# Both values measure how long the pool has gone WITHOUT turning over.
# pool.warn.at.seconds          — WARN log + ExtentReport infra-node entry
# pool.acquire.timeout.seconds  — hard fail (UserPoolAcquisitionTimeoutException)
pool.warn.at.seconds=300
pool.acquire.timeout.seconds=600

# ─── Session lease (SessionPool hygiene) ─────────────────────────────────────
# Under the SessionPool model these bound how much total reuse one logged-in browser session
# accumulates before borrow() destroys and recreates it — hygiene against browser memory bloat
# and server-side session TTL, NOT anti-hoarding (sessions return to the pool after every row,
# so a thread can never hoard a permit between rows). Safe to raise.
session.max.lease.rows=10
session.max.lease.seconds=600

# ─── SessionPool borrow timeout ───────────────────────────────────────────────
# Max time one data-provider thread may wait to borrow a logged-in session. Much larger than
# pool.acquire.timeout.seconds by design: with runInParallel=true there can be
# (methods x data-provider-thread-count) waiters sharing capacity(=UI user count) sessions,
# and a waiter may legitimately queue behind several multi-minute rows.
session.borrow.timeout.seconds=1800

# ─── Suite circuit breaker ────────────────────────────────────────────────────
# OFF by default — flip to true only for scheduled production regression runs.
suite.abort.enabled=false
suite.abort.on.failure.percent=30
suite.abort.min.tests.before.check=100
suite.abort.check.interval=50

# ─── Retry / Flaky Analytics ──────────────────────────────────────────────────
# 0 = retry disabled (default). Set to 2 or 3 to enable retry for flaky tests.
retry.max.count=0

# ─── SessionPool cold-start concurrency gate (headed runs only) ──────────────
# Caps how many brand-new browser sessions may launch at the exact same instant when running
# HEADED (headless=false) — several visible Chrome windows launching simultaneously can get
# clipped/mis-sized by the OS window manager (confirmed live: ViewportEnforcer mismatches +
# a crashed renderer, all clustered around simultaneous cold starts under parallel="tests").
# Ignored entirely when headless=true (no real window to clip, so headless keeps full pool
# capacity concurrency — Docker/CI is unaffected). Default mirrors this suite's own
# pre-parallel="tests" max concurrency (largest single <test> block's thread-count).
session.headed.coldstart.maxconcurrent=2

# ─── WebDriver command read-timeout ───────────────────────────────────────────
# Caps how long any single local WebDriver command (findElement, executeScript, etc.) may block
# before throwing. Reverted to 180s (2026-09-28) — Selenium's own built-in default
# (ClientConfig#defaultReadTimeout) — after the 60s override (introduced alongside the GV suite's
# parallel="tests" experiment, to free a stuck session's slot ~3x faster under concurrent load)
# was suspected of cutting off session-creation/commands that were merely slow under concurrent
# staging-server load, not genuinely stuck ("Could not start a new session ... request timed out"
# skips, run 20260928_134950). Revisit only alongside parallel="tests" — with the GV suite back on
# parallel="none" there's no thundering-herd slot contention needing fast release, so the shorter
# value has no upside and only risks prematurely failing genuinely-slow (not stuck) commands.
# Override with -Dwebdriver.command.readtimeout.seconds=<n> for a one-off run.
webdriver.command.readtimeout.seconds=180
