# ─── Diagnostics — HTML capture ───────────────────────────────────────────────
# Captures full page DOM to reports/html-captures/ on NoSuchElementException / TimeoutException
diagnostics.html.capture.on.element.failure=true

# ─── Diagnostics — Application server utilization ────────────────────────────

# ─── Diagnostics — Database server utilization ───────────────────────────────

# ─── Diagnostics — Event log ──────────────────────────────────────────────────
diagnostics.event.log.enabled=false
diagnostics.event.log.lines=30

# ─── Diagnostics — Driver capabilities ───────────────────────────────────────
diagnostics.driver.capabilities.enabled=true

# ─── Diagnostics — Action Trail ──────────────────────────────────────────────
# ALL  = include Action Trail in diagnostic bundle for both pass and fail tests
# FAIL = include Action Trail only when the test fails
action.trail.capture.mode=FAIL
action.trail.buffer.size=200
action.trail.display.limit=50

# ─── Diagnostics — UI Components capture mode ────────────────────────────────
# ALL  = include UI Components (ExtJS) in diagnostic bundle for both pass and fail tests
# FAIL = include UI Components only when the test fails
ui.components.capture.mode=FAIL

# ─── UI Component Diagnostics ─────────────────────────────────────────────────
ui.diagnostics.enabled=true

# ─── Diagnostics — Active popup capture ──────────────────────────────────────
diagnostics.active.popup.enabled=true
# CSS selector for framework-specific modal detection (ExtJS default)
diagnostics.popup.selector=.x-window-body

# ─── Diagnostics — DB state snapshot ─────────────────────────────────────────
diagnostics.db.state.enabled=false
diagnostics.db.state.query=SELECT vchcode,vchdate,slcode,amount FROM finvchmain ORDER BY creation_dt DESC LIMIT 5

# ─── Diagnostics — Thread dump on timeout ────────────────────────────────────
diagnostics.thread.dump.enabled=false

# ── Step Timeline ─────────────────────────────────────────────────────────────
step.timeline.enabled=true
# ALL | FAIL — when to include the timeline section in the diagnostic bundle.
step.timeline.capture.mode=ALL
# Duration (ms) above which a step bar is coloured orange (slow step warning).
step.timeline.warn.ms=3000

# ── Wait Analysis ─────────────────────────────────────────────────────────────
wait.analysis.enabled=true
# ALL | FAIL
wait.analysis.capture.mode=ALL
# Duration (ms) above which a wait entry is flagged SLOW in the table.
wait.analysis.slow.threshold.ms=5000
# Minimum total test duration (seconds) to include the Wait Analysis section. 0 = always include.
wait.analysis.min.test.duration.seconds=0

# ── Retry / Flaky Analytics ──────────────────────────────────────────────────
# Master switch for the FlakySummarySection in the diagnostic bundle.
flaky.summary.enabled=true
# flakyScore = (retryAttempts / retryMaxCount) * 100. Score >= this -> HIGH (FLAKY) badge.
flaky.score.warn.threshold=50

# ─── Custom Metrics (web.dev Performance Observer APIs) ───────────────────────
custom.metrics.enabled=true
# When to capture: ALL (pass + fail) | FAIL (failures only) | NEVER
custom.metrics.capture.mode=ALL
custom.metrics.slow.resource.threshold.ms=2000
custom.metrics.user.timing.warn.ms=3000
custom.metrics.fail.on.long.task.count=0
custom.metrics.long.animation.frame.enabled=true
custom.metrics.server.timing.enabled=true

# ─── Frontend Diagnostics (ExtJS / React / Angular) ──────────────────────────
frontend.diagnostics.enabled=true
# When to include in the report: ALL (pass + fail) | FAIL (failures only) | NEVER
frontend.diagnostics.capture.mode=FAIL
frontend.diagnostics.component.render.warn.ms=200

# ─── Frontend Diagnostics — New Feature Toggles ──────────────────────────────
frontend.diagnostics.dom.tracking.enabled=true
frontend.diagnostics.memory.tracking.enabled=true
frontend.diagnostics.interaction.tracking.enabled=true
frontend.diagnostics.grid.render.tracking.enabled=true
frontend.diagnostics.reflow.detection.enabled=true

# ─── Diagnostics — page-state snapshot at a failing step ─────────────────────
# A failing step also records a compact summary of the live page (visible masks, windows, open
# dropdown lists, cell editors, login error text, in-flight Ajax) so intermittent failures show
# their real cause. Preferred over lengthening any timeout.
diagnostics.page.state.enabled=true
diagnostics.page.state.max.items=8
diagnostics.page.state.max.text.chars=160
