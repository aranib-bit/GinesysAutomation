# ── PUBLICAPI (Ginesys published partner API — separate service + auth) ────
# clientId/clientSecret are placeholders — replace via env override once PUBLICAPI credentials
# are issued; publicapi.enabled stays false until then, so PublicApiAvailabilityChecker never
# tries to reach these placeholder values.

# ── Data setup strategy — HYBRID everywhere per earlier decision ───────────
datasetup.item.strategy=HYBRID
datasetup.grc.strategy=HYBRID
datasetup.dc.strategy=HYBRID
datasetup.transferout.strategy=HYBRID
datasetup.serviceinvoiceadhoc.strategy=HYBRID

# ── Backfill pool-deadlock prevention ───────────────────────────────────────
# SessionPool holds one UI user per thread for a WEB test's whole lifetime; a backfill firing
# on that same thread needs ONE MORE UI credential. Prevented proactively at suite start —
# see SuiteDataLoader.validateUserPoolAgainstThreadCount() — rather than via a short runtime
# acquire timeout, which would risk aborting a legitimate backfill under transient contention
# right when the data actually needs to be created. Backfill uses the framework's normal
# pool.acquire.timeout.seconds (execution.properties, 600s default) like every other caller.
#
# SessionPool.capacity() = (UI users in UsersList.xlsx) - backfillHeadroom. UsersList.xlsx's
# "UIUsers" sheet currently has 7 rows (aranibarman, arn, barbara, mkundu, webapi1, webapi2,
# webapi3) — all classified UserType.UI today since that sheet has no userType column (the
# "APIUsers" sheet is a differently-shaped APIKey/Usage table, not login credentials, and
# contributes 0 rows to the pool — see UserCredentialLoader's class Javadoc). With thread-count=4
# intended, headroom=2 reserves 2 of the 7 UI-classified users as spares for backfill and gives
# SessionPool back its intended capacity of ~4-5 concurrent browser sessions.
datafallback.userPool.headroomValidationMode=WARN

# ── Data-availability backfill (WEB -> no data -> WEBAPI/PUBLICAPI/k6 -> WEB) ─
datafallback.smallQuantityThreshold=20
# First available wins. Flip to PUBLICAPI,WEBAPI to reverse priority — no code change needed.
datafallback.smallQty.preferredOrder=WEBAPI,PUBLICAPI
datafallback.k6.binaryPath=k6
# The k6 project lives inside this project (performance/k6); scenario files are derived from k6.home.
# datafallback.k6.scriptPath.<key>=... remains available as an explicit per-key override.
k6.home=performance/k6

