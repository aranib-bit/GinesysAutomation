# ── WEBAPI (internal — same endpoints k6 hits) ──────────────────────────────
webapi.baseuri=https://stage-ideal.ginesys.cloud/WebAPI
webapi.timeout.connect=10000
webapi.timeout.read=15000
# Mirrors k6's lib/config.js loginPath/apiPrefix (relative to webApiBaseUri, which already
# includes /WebAPI — unlike k6's raw baseUrl which is hostname-only). Confirmed tenant-agnostic
# across stage-ideal/qafeature/qahbros's own environment JSON configs — kept config-driven here
# for the same reason k6 keeps it env-overridable, not because it currently differs.
webapi.loginPath=/token
webapi.apiPrefix=/api

# ── WEBAPI auth header shape — confirmed for single-tenant via captured HAR (Logout.har).
# Multi-tenant (qafeature/qahbros) names are placeholders until that tenant's own HAR is
# captured — see WebApiSessionClient's javadoc. Change here, not in Java, once confirmed.
webapi.auth.singleTenant.ginesysAuthHeaderName=ginesysauth
webapi.auth.singleTenant.authorizationHeaderName=authorization
webapi.auth.multiTenant.ginesysAuthHeaderName=ginesysauth
webapi.auth.multiTenant.authorizationHeaderName=authorization
webapi.auth.multiTenant.extraHeaderName=
webapi.auth.multiTenant.extraHeaderValue=

