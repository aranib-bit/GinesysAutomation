timeout=30
# chrome | firefox | edge
itemscanmaxtimeout=180000
# EXCEL | DB — selects which DataSource implementation loads test data
# App login credentials used in DB mode (must match hrdemp.abbre in the DB)

# Enables the WEBAPI/PUBLICAPI API client layer and the data-availability backfill path
# (see api.properties for the full config surface these features use)
api.testing.enabled=true

# Maximum columns allowed in an ExtJS grid's multi-column sort at once (application-wide default —
# see GridColumnMenu.sortByPriority(List, int) for how a module can override this with its own value)
grid.multisort.max.columns=3
