# ─── Remote Machine Setup ─────────────────────────────────────────────────────
# OS is AUTO-DETECTED at runtime via SSH probe. Do NOT specify server type here.
# Credentials — prefer environment variables (CI/CD); config keys are a plaintext
# fallback for local/dev runs only. Env vars always take priority when both are set.
#   SSH   → env: REMOTE_LOG_SSH_USER  / REMOTE_LOG_SSH_PASS
#   WinRM → env: REMOTE_LOG_WINRM_USER / REMOTE_LOG_WINRM_PASS
#
# Application Server — fill host to enable, leave blank to disable
remote.app.server.host=172.22.16.4
#
# Log path patterns — comma-separated. Wildcards are expanded by Get-ChildItem (WinRM)
# or glob (SSH). Size-rotated files are sorted by LastWriteTime DESC and capped by
# remote.logs.winrm.rotated.max.files. Date-named files are matched by the date wildcard.
#
# Finance API (C#/.NET, custom Serilog format):
#   FinanceAPI_dd-MM-yyyy_ERROR.log  — date-based, one file per day (all Finance API errors)
#   FinanceAPI_EFLogger_dd-MM-yyyy.log — date-based, EF Core debug logs for errors that occurred
# 	WebAPI (Log4Net, level-first format, size-rotated: ErrorApp.log, ErrorApp.1, ErrorApp.2...):
#   ErrorApp* — error-level logs
#   InfoApp*  — info-level logs (business operation flow, useful for failure context)
#   DebugApp* — debug-level logs (detailed WebAPI diagnostics)
#   nhibernatesql.log* — NHibernate SQL debug logs (DB queries)
# 	WebUI (Log4Net, single file, not rotated):
#   trace.log — UI-layer debug/error logs
#
# NOTE: Leave remote.logs.keywords blank to capture all lines within the test time window.
# Add keywords (e.g. ERROR,WARN,Exception) to restrict output to matching lines only.
#
# Log paths are now managed in app-log-paths.properties (one path per line, easier to maintain).
# The file below is read by RawPropertyReader — backslashes are safe without escaping.
remote.app.server.log.paths.file=app-log-paths.properties
# Fallback if the file above is missing (comma-separated, same paths):
#remote.app.server.log.paths=C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_*_ERROR.log,C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_*_INFO.log,C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_EFLogger_*,C:\GSL\GINESYS12\WebAPI\Logs\ErrorApp*,C:\GSL\GINESYS12\WebAPI\Logs\InfoApp*,C:\GSL\GINESYS12\WebAPI\Logs\DebugApp*,C:\GSL\GINESYS12\WebAPI\Logs\nhibernatesql.log*,C:\GSL\GINESYS12\WebUI\trace.log
remote.app.server.ssh.port=22
remote.app.server.winrm.port=5985
remote.app.server.winrm.use.https=false
# WinRM credentials (Windows app server) — leave blank to use env vars only
remote.app.server.winrm.username=arani.barman
remote.app.server.winrm.password=Gsl!12345
# SSH credentials (Linux app server) — leave blank to use env vars only
remote.app.server.ssh.username=
remote.app.server.ssh.password=
#
# Database Server — fill host to enable, leave blank to disable
remote.db.server.host=
remote.db.server.log.paths=/var/log/postgresql/postgresql.log
remote.db.server.ssh.port=22
remote.db.server.winrm.port=5985
remote.db.server.winrm.use.https=false
# WinRM credentials (Windows DB server) — leave blank to use env vars only
remote.db.server.winrm.username=
remote.db.server.winrm.password=
# SSH credentials (Linux DB server) — leave blank to use env vars only
