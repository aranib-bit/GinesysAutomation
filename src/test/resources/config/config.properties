remote.db.server.ssh.password=

# ─── Remote Log Collection Behaviour ─────────────────────────────────────────
# ON_FAILURE = collect on test failure only | ALWAYS = collect always | NEVER = disabled
remote.logs.capture.mode=ALWAYS
remote.logs.keywords=
remote.logs.max.lines=500
remote.logs.debug.enabled=false

# ─── SSH Settings ─────────────────────────────────────────────────────────────
remote.logs.ssh.connect.timeout.seconds=10
remote.logs.ssh.read.timeout.seconds=30
remote.logs.ssh.command.timeout.seconds=60
remote.logs.ssh.retry.count=3
# ACCEPT_NEW (default) | STRICT (requires ~/.ssh/known_hosts) | DISABLED (insecure)
remote.logs.ssh.host.key.verify=ACCEPT_NEW

# ─── SSH Connection Pool ──────────────────────────────────────────────────────
remote.logs.ssh.pool.size=5
remote.logs.ssh.pool.max.wait.seconds=10

# ─── WinRM Settings ───────────────────────────────────────────────────────────
remote.logs.winrm.connect.timeout.seconds=10
remote.logs.winrm.operation.timeout.seconds=60
# Max rotated files to read per size-rotated log path pattern (most recent first).
# Applies to: ErrorApp*, InfoApp*, DebugApp*, nhibernatesql.log* (WebAPI Log4Net files).
# Date-named files (FinanceAPI_*) are also sorted by LastWriteTime — this cap limits
# how many date-named files are read per wildcard (3 = today + yesterday + day before).
remote.logs.winrm.rotated.max.files=3

# ─── Log Timestamp Parsing ────────────────────────────────────────────────────
# Timezone offset appended when parsing log lines that use "yyyy-MM-dd HH:mm:ss"
# format (no embedded offset). Use +05:30 for IST, Z for UTC.
# Applies to FinanceAPI and other .NET logs that do not include a timezone marker.
remote.logs.server.timezone.offset=+05:30

# ─── Document selector (atomic SL + doc selection) ────────────────────────────
# SQL already enforces debit_credit='D' AND pending>0. This mode is a per-SL trimming policy.
# POSITIVE = strict positive (default). MIXED = any non-zero. HYBRID = positive, fall back to mixed per SL.
doc.selector.mode=POSITIVE
# Over-fetch SLs from DB to absorb parallel contention. Effective pool = subLedgerCount × this.
doc.selector.overfetch.multiplier=3
# Backoff (ms) between retry attempts. The retry bound is derived dynamically from
# the distinct slcode count in v_pending_adj — no static retry.max needed.
doc.selector.retry.backoff.ms=1500
# Floor for documentCount when ArVoucherFixtureOptions.defaults() is used
# (a hard-coded 1 is unsafe under parallel — multiple threads compete for the only doc per SL).
doc.selector.documentcount.default=3

# ─── UI Framework Adapter ──────────────────────────────────────────────────────
# Target UI framework: extjs | react | angular
# Change this value when migrating the application — zero code changes elsewhere.
application.type=extjs

# ─── UI Component Diagnostics ─────────────────────────────────────────────────
# Enable component state section in the failure diagnostic report.
ui.diagnostics.enabled=true

# ─── Performance Timing ───────────────────────────────────────────────────────
# Capture domReady, pageLoad, XHR pending count, and JS heap on failure.
performance.timing.enabled=true

# ─── JS Error JSON Export ─────────────────────────────────────────────────────
# Write structured JSON artifact to reports/js-errors/ for ELK/Kibana/Splunk integration.
js.error.json.export.enabled=true

# ─── Action Trail ─────────────────────────────────────────────────────────────
# buffer.size : max steps retained per thread (ring buffer — older steps are dropped).
# display.limit: max steps shown in ExtentReport; JSON export always uses the full buffer.
action.trail.buffer.size=200
action.trail.display.limit=50

# ─── Custom Metrics (web.dev Performance Observer APIs) ───────────────────────
# Master toggle — false means no JS collection and no section in the report.
custom.metrics.enabled=true

# When to capture: ALL (pass + fail) | FAIL (failures only) | NEVER
custom.metrics.capture.mode=ALL

# Resources with load duration above this value appear in the Slow Resources table.
custom.metrics.slow.resource.threshold.ms=2000

# User Timing measures (performance.mark / performance.measure) longer than this
# are highlighted with an orange warning in the report.
custom.metrics.user.timing.warn.ms=3000

# Automatically fail the test when the Long Tasks count exceeds this number.
# Set to 0 (default) to disable auto-fail and treat metrics as informational only.
custom.metrics.fail.on.long.task.count=0

# Include Long Animation Frame entries (Chrome 123+; no-op on older browsers).
custom.metrics.long.animation.frame.enabled=true

# Include Server Timing entries reported by the server via HTTP response headers.
custom.metrics.server.timing.enabled=true

# ─── Frontend Diagnostics (ExtJS / React / Angular) ──────────────────────────
# Enable framework-specific JS instrumentation:
#   ExtJS  — patches Ext.Component.setLoading, afterRender, layout, event handlers
#   React  — MutationObserver for loading states, layout-shift observer, User Timing harvest
#   Angular — getAllAngularTestabilities() polling, CDK overlay observer, layout-shift
# Set to true along with application.type=extjs|react|angular to activate.
frontend.diagnostics.enabled=true

# When to include in the report: ALL (pass + fail) | FAIL (failures only) | NEVER
frontend.diagnostics.capture.mode=ALL

# Component render duration (ms) above this threshold is highlighted in the report.
frontend.diagnostics.component.render.warn.ms=200

# ─── Frontend Diagnostics — New Feature Toggles ──────────────────────────────
# DOM node count captured at collection time; >5000 nodes flagged as DOM explosion.
frontend.diagnostics.dom.tracking.enabled=true
# JS heap memory (Chrome performance.memory API) captured in Custom Metrics section.
frontend.diagnostics.memory.tracking.enabled=true
# Click event tracking — records tag, class, and timestamp of every click during the test.
frontend.diagnostics.interaction.tracking.enabled=true
# ExtJS-specific: captures Ext.grid.Panel render with row and column counts.
frontend.diagnostics.grid.render.tracking.enabled=true
# Forced reflow detection — patches getBoundingClientRect(); flags calls >5ms (>50ms = warning).
frontend.diagnostics.reflow.detection.enabled=true
