timeout=30
env=staging
db.creation.tolerance=150
url=https://stage-ideal.ginesys.cloud/GINESYSWeb/UI/index.html#erplogin
#url=http://qam-18/GINESYSWeb/UI/index.html#login
#chrome,firefox,edge
browser=chrome
#local,remote
runmode=local
remoteurl=http://localhost:4444/wd/hub
itemscanmaxtimeout=180000
pollingof=2
# EXCEL | DB switch test data source; EXCEL = existing behaviour (default)
testdata.source=DB
# App login credentials used in DB mode (must match hrdemp.abbre in the DB)
appusername=aranibarman
apppassword=ab
# INDIA | USA_3 | USA_4 | USA_5 | USA_6 | ALPHANUMERIC | ROTATE
cheque.country=ROTATE
# ExtJS synchronization timeouts (seconds). Reduce extjs.timeout for fast networks; floor is extjs.min.timeout.
extjs.timeout=40
extjs.min.timeout=10
# Max retries (3 s each) for the non-critical warning-message text read in verifyWarningMessage()
warning.msg.max.retries=10
# Select-Document popup timing / scroll tuning
selectdoc.grid.load.buffer.ms=200
selectdoc.jump.render.ms=500
selectdoc.scroll.max.attempts=20
selectdoc.scroll.min.attempts=5
selectdoc.scroll.step.wait.ms=400
selectdoc.focusrow.render.ms=1500
selectdoc.click.buffer.ms=300
selectdoc.loader.max.retries=3
# Max retries when a click is intercepted by the transient ext-element overlay (e.g. ext-element-6).
# Each retry waits for all ExtJS masks / ext-element overlays to clear before re-attempting.
click.overlay.retry.max=3

# ─── Execution control ────────────────────────────────────────────────────────
execution.type=SET1
thread.count=5
concurrent.user.count=2
sync.timeout.seconds=30

# ─── Browser behaviour ────────────────────────────────────────────────────────
headless=false
incognito=false
acceptInsecureCerts=false

# ─── Remote execution providers ───────────────────────────────────────────────
grid.url=http://localhost:4444/wd/hub
docker.grid.url=http://localhost:4444/wd/hub
browserstack.username=
browserstack.accesskey=
browserstack.build.name=CI Build
lambdatest.username=
lambdatest.accesskey=

# ─── Network capture ─────────────────────────────────────────────────────────
# Chrome/Edge → CDP   Firefox → BiDi (webSocketUrl=true already set in BrowserOptions)
enable.network.logs=true
network.capture.failed.only=false
network.capture.headers=true
network.capture.body=true
# Comma-separated URL substrings to capture. Empty = capture all traffic.
# Example: network.capture.url.filter=/api/,/finance/
network.capture.url.filter=

# ─── Browser log capture ──────────────────────────────────────────────────────
browser.logs.enabled=true
browser.logs.capture.on.failure=false
browser.logs.fail.on.js.error=false
browser.logs.fail.on.critical.js.error=true
browser.logs.capture.only=false
browser.logs.level=SEVERE
browser.logs.warning.patterns=
browser.logs.ignore.patterns=

# ─── Finance posting window ───────────────────────────────────────────────────
# Maximum calendar days a back-dated document date may go into the past.
# Variants whose backDateDays exceed this are clamped; the test self-skips if
# the clamped date would still fall outside an open Finance Month/Accounting Year.
finance.backdate.max.days=58

# ─── Unexpected popup detection ───────────────────────────────────────────────
popup.detection.enabled=true
popup.detection.timeout.ms=1500

# ─── Diagnostics — HTML capture ───────────────────────────────────────────────
# Captures full page DOM to reports/html-captures/ on NoSuchElementException / TimeoutException
diagnostics.html.capture.on.element.failure=true

# ─── Diagnostics — Application server utilization ────────────────────────────
# CPU + memory snapshot from the app server on test failure (localhost = direct exec)
diagnostics.app.server.util.enabled=false
diagnostics.app.server.type=WINDOWS
diagnostics.app.server.host=localhost

# ─── Diagnostics — Database server utilization ───────────────────────────────
diagnostics.db.server.util.enabled=false
diagnostics.db.server.type=WINDOWS
diagnostics.db.server.host=localhost

# ─── Diagnostics — Event log ──────────────────────────────────────────────────
# Windows: wevtutil Application event log (Error + Critical)
# Linux:   journalctl -p err or /var/log/syslog fallback
diagnostics.event.log.enabled=false
diagnostics.event.log.lines=30

# ─── Diagnostics — Driver capabilities ───────────────────────────────────────
# Captures browser name, version, session ID from WebDriver on failure
diagnostics.driver.capabilities.enabled=true

# ─── Diagnostics — Active popup capture ──────────────────────────────────────
# Detects JS alerts and visible ExtJS/UI modals at the point of failure
diagnostics.active.popup.enabled=true
# CSS selector for framework-specific modal detection (ExtJS default)
diagnostics.popup.selector=.x-window-body

# ─── Diagnostics — DB state snapshot ─────────────────────────────────────────
# Runs a configurable SELECT query on failure. Keep READ-ONLY (no DML).
diagnostics.db.state.enabled=false
diagnostics.db.state.query=SELECT vchcode,vchdate,slcode,amount FROM finvchmain ORDER BY creation_dt DESC LIMIT 5

# ─── Diagnostics — Thread dump on timeout ────────────────────────────────────
# Captures BLOCKED/WAITING thread states on TimeoutException failures
diagnostics.thread.dump.enabled=false

# ─── Remote Machine Setup ─────────────────────────────────────────────────────
# OS is AUTO-DETECTED at runtime via SSH probe. Do NOT specify server type here.
# Credentials via environment variables ONLY — never put passwords in this file:
#   SSH   → REMOTE_LOG_SSH_USER  / REMOTE_LOG_SSH_PASS
#   WinRM → REMOTE_LOG_WINRM_USER / REMOTE_LOG_WINRM_PASS
#
# Application Server — fill host to enable, leave blank to disable
remote.app.server.host=
# Date-named Finance API logs use wildcards (e.g. FinanceAPI_11-05-2026_ERROR).
# Auto-rotated WebAPI logs use * suffix (ErrorApp, ErrorApp.1 ...).
# Most recent files per pattern are read first (controlled by remote.logs.winrm.rotated.max.files).
remote.app.server.log.paths=C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_*_ERROR,C:\ProgramData\GINESYS\Logs\FinanceAPI\FinanceAPI_EFLogger_*,C:\GSL\GINESYS12\WebAPI\Logs\ErrorApp*,C:\GSL\GINESYS12\WebUI\trace.log
remote.app.server.ssh.port=22
remote.app.server.winrm.port=5985
remote.app.server.winrm.use.https=false
#
# Database Server — fill host to enable, leave blank to disable
remote.db.server.host=
remote.db.server.log.paths=/var/log/postgresql/postgresql.log
remote.db.server.ssh.port=22
remote.db.server.winrm.port=5985
remote.db.server.winrm.use.https=false

# ─── Remote Log Collection Behaviour ─────────────────────────────────────────
# ON_FAILURE = collect on test failure only | ALWAYS = collect always | NEVER = disabled
remote.logs.capture.mode=NEVER
remote.logs.keywords=ERROR,WARN,Exception
remote.logs.max.lines=500
remote.logs.debug.enabled=false

# ─── SSH Settings ─────────────────────────────────────────────────────────────
remote.logs.ssh.connect.timeout.seconds=10
remote.logs.ssh.read.timeout.seconds=30
remote.logs.ssh.command.timeout.seconds=60
remote.logs.ssh.retry.count=3
# ACCEPT_NEW (default) | STRICT (requires ~/.ssh/known_hosts) | DISABLED (insecure)
remote.logs.ssh.host.key.verify=ACCEPT_NEW

# ─── SSH Connection Pool ──────────────────────────────────────────────────────
remote.logs.ssh.pool.size=5
remote.logs.ssh.pool.max.wait.seconds=10

# ─── WinRM Settings ───────────────────────────────────────────────────────────
remote.logs.winrm.connect.timeout.seconds=10
remote.logs.winrm.operation.timeout.seconds=60
# Max rotated/date-named files to read per log path pattern (most recent first)
remote.logs.winrm.rotated.max.files=3

# ─── Document selector (atomic SL + doc selection) ────────────────────────────
# SQL already enforces debit_credit='D' AND pending>0. This mode is a per-SL trimming policy.
# POSITIVE = strict positive (default). MIXED = any non-zero. HYBRID = positive, fall back to mixed per SL.
doc.selector.mode=POSITIVE
# Over-fetch SLs from DB to absorb parallel contention. Effective pool = subLedgerCount × this.
doc.selector.overfetch.multiplier=3
# Backoff (ms) between retry attempts. The retry bound is derived dynamically from
# the distinct slcode count in v_pending_adj — no static retry.max needed.
doc.selector.retry.backoff.ms=1500
# Floor for documentCount when ArVoucherFixtureOptions.defaults() is used
# (a hard-coded 1 is unsafe under parallel — multiple threads compete for the only doc per SL).
doc.selector.documentcount.default=3
