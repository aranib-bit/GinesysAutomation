# ─── Report flush ─────────────────────────────────────────────────────────────
# report.flush.batch.enabled: true = flush every report.flush.batch.size tests (batched);
#                             false = flush the full HTML after each test case
report.flush.batch.enabled=false
report.flush.batch.size=100

# ─── Performance Timing ───────────────────────────────────────────────────────
# Capture domReady, pageLoad, XHR pending count, and JS heap on failure.
performance.timing.enabled=true

# ─── JS Error JSON Export ─────────────────────────────────────────────────────
# Write structured JSON artifact to reports/js-errors/ for ELK/Kibana/Splunk integration.
js.error.json.export.enabled=true

# ─── Screenshot retention ─────────────────────────────────────────────────────
screenshot.retention.days=3
screenshot.max.per.test=3

# ─── Amount numbering style ───────────────────────────────────────────────────
# BCP-47 locale tag controlling digit-grouping for damount/camount and other
# amount values across all voucher reports (VoucherReportUtils.fmtAmount).
#   en-IN = Indian grouping, e.g. 12,34,567.89 (default — Ginesys is an Indian retail system)
#   en-US = Western grouping, e.g. 1,234,567.89
#   ar-AE = Dubai/UAE-style grouping
# Any other valid BCP-47 tag works — no code change needed to add a new style.
report.amount.numbering.locale=en-IN

# ─── Full Validation Details XLSX export ──────────────────────────────────────
# "Full Validation Details" (Database Snapshot Validation) always suppresses genuinely-unchanged
# MUST_NOT_CHANGE columns from the rendered HTML table (reduces noise) — when this is enabled, it
# ALSO writes the complete, unfiltered set of every checked column to a small .xlsx per test run
# (reports/runs/<runId>/snapshots/), linked from that section, so a suppressed column can still be
# looked up later. Off by default: opt-in, since the concern is file-COUNT growth across a large
# suite run, not per-file size (a single export is only tens of KB).
report.export.fullValidationXlsx.enabled=false

# ─── Business vs. debug log visibility (Extent HTML report only) ─────────────
# Every LogCategory is classified debug or business (see LogCategory#isDebugCategory). When this
# is false (default), "debug" categories — UI_ACTION, JS, PERF, CONTEXT_SWITCH, DATA_BACKFILL, DB,
# NETWORK, RCA, SESSION, RECOVERY — are suppressed from the Extent HTML report; only "business"
# categories — BUSINESS, VALIDATION, MODULE, SUB_MODULE, MENU, SUB_MENU, NAVIGATION, FRAMEWORK,
# TEST_STEP_STATUS — are shown, so a reader sees "did this succeed or fail" rather than every
# low-level Selenium action. File logging via ReportLogger's per-category log files is NEVER
# affected by this flag — only the Extent HTML report. Set to true for a debugging run.
report.debugLogs.extentVisible=false
