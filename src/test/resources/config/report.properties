# ─── Report flush ─────────────────────────────────────────────────────────────
# report.flush.batch.enabled: true = flush every report.flush.batch.size tests (batched);
#                             false = flush the full HTML after each test case
report.flush.batch.enabled=false
report.flush.batch.size=100

# ─── Performance Timing ───────────────────────────────────────────────────────
# Capture domReady, pageLoad, XHR pending count, and JS heap on failure.
performance.timing.enabled=true

# ─── JS Error JSON Export ─────────────────────────────────────────────────────
# Write structured JSON artifact to reports/js-errors/ for ELK/Kibana/Splunk integration.
js.error.json.export.enabled=true

# ─── Screenshot retention ─────────────────────────────────────────────────────
screenshot.retention.days=3
screenshot.max.per.test=3
